<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide Online - BB Resepsi</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="hero" id="hero">
      <div class="topbar">
        <div class="brand">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 2a7 7 0 0 1 6.995 6.777L19 9v6a7 7 0 0 1-13.995.223L5 15V9A7 7 0 0 1 12 2Zm0 2a5 5 0 0 0-4.996 4.783L7 9v6a5 5 0 0 0 9.995.217L17 15V9a5 5 0 0 0-5-5Zm0 4a1 1 0 0 1 .993.883L13 11v1.586l1.293-1.293a1 1 0 0 1 1.414 1.414l-3 3a1 1 0 0 1-1.414 0l-3-3a1 1 0 0 1 1.414-1.414L11 12.586V11a1 1 0 0 1 1-1Zm0 0Z"
            />
          </svg>
          <span>BB Resepsi</span>
        </div>
      </div>
      <div class="caption">
        <h1 id="caption-title">Selamat Datang di Galeri Resepsi</h1>
        <p id="caption-text">
          Gunakan panah atau tombol untuk melihat galeri foto resepsi. Halaman
          ini berjalan secara offline dengan file di folder
          <strong>images/</strong>.
        </p>
      </div>
      <div class="footer">bb_berkat &bull; bb_pinangan</div>
      <div class="slides-wrap" id="slides"></div>
      <div class="overlay"></div>
      <div class="controls">
        <button class="control-btn" id="prev">Sebelumnya</button>
        <button class="control-btn" id="toggle">Putar Otomatis</button>
        <button class="control-btn" id="next">Selanjutnya</button>
      </div>
      <div class="dots" id="dots"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
