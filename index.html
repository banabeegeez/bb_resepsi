<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide Online - BB Resepsi</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="hero" id="hero">
      <div class="hero-header">
        <div class="hero-title">
          <h1>Pinangan Bana & Bella</h1>
          <p>Slide Online</p>
        </div>
        <div class="hero-meta">
          <div class="slide-counter">
            <span id="current-slide">1</span> / <span id="total-slides">0</span>
          </div>
          <button class="icon-btn" id="fullscreen" type="button">
            Fullscreen
          </button>
        </div>
      </div>

      <div class="viewer">
        <button
          class="nav-btn prev"
          id="prev"
          type="button"
          aria-label="Foto sebelumnya"
        >
          <span>&larr;</span>
        </button>
        <div class="slides-wrap" id="slides"></div>
        <button
          class="nav-btn next"
          id="next"
          type="button"
          aria-label="Foto selanjutnya"
        >
          <span>&rarr;</span>
        </button>
      </div>

      <div class="thumbs" id="dots"></div>
      <div class="footer">bb_berkat • bb_pinangan</div>
      <div class="overlay"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
